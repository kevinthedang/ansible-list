---
- hosts: servers
  become: true

  pre_tasks:
    - name: Ensure apt cache is up to date.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when:
        - ansible_facts.os_family == "Debian"

  tasks:
    - name: Setup Docker.
      ansible.builtin.import_tasks: ./tasks/docker.yml